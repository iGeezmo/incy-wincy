<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Схема маршрутизации IW 02 Work+ Complete</title>
  <desc id="desc">Рабочие зарубежные сервисы идут через PROXY, российские и локальные сервисы идут DIRECT</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/></filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="70" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800">Как работает IW 02 Work+ Complete</text>
  <text x="70" y="108" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Выборочная маршрутизация: только нужный трафик идёт через прокси.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="180" width="260" height="160" rx="24" fill="#151d2f" stroke="#334155"/>
    <text x="200" y="225" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800">Устройство</text>
    <text x="200" y="260" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">iPhone / iPad</text>
    <text x="200" y="292" text-anchor="middle" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">INCY + профиль IW</text>
  </g>

  <path d="M330 230 C410 230 420 185 500 185" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
  <polygon points="496,173 520,185 496,197" fill="#60a5fa"/>
  <path d="M330 290 C410 290 420 345 500 345" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <polygon points="496,333 520,345 496,357" fill="#34d399"/>

  <g filter="url(#shadow)">
    <rect x="520" y="130" width="290" height="125" rx="22" fill="#172554" stroke="#3b82f6"/>
    <text x="665" y="170" text-anchor="middle" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800">PROXY</text>
    <text x="665" y="202" text-anchor="middle" fill="#bfdbfe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">AI · Dev · SaaS · Work</text>
    <text x="665" y="228" text-anchor="middle" fill="#93c5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">ChatGPT · GitHub · Figma · Claude</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="285" width="290" height="125" rx="22" fill="#052e16" stroke="#22c55e"/>
    <text x="665" y="325" text-anchor="middle" fill="#dcfce7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800">DIRECT</text>
    <text x="665" y="357" text-anchor="middle" fill="#bbf7d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Локальные и российские сервисы</text>
    <text x="665" y="383" text-anchor="middle" fill="#86efac" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Яндекс · банки · Госуслуги · LAN</text>
  </g>

  <path d="M810 192 H915" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
  <polygon points="910,180 934,192 910,204" fill="#60a5fa"/>
  <path d="M810 347 H915" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <polygon points="910,335 934,347 910,359" fill="#34d399"/>

  <g filter="url(#shadow)">
    <rect x="935" y="130" width="195" height="125" rx="22" fill="#111827" stroke="#475569"/>
    <text x="1032" y="182" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Внешний маршрут</text>
    <text x="1032" y="215" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">через сервер</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="935" y="285" width="195" height="125" rx="22" fill="#111827" stroke="#475569"/>
    <text x="1032" y="337" text-anchor="middle" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">Обычный интернет</text>
    <text x="1032" y="370" text-anchor="middle" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">напрямую</text>
  </g>

  <text x="70" y="468" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Неподходящий под правила трафик в Work+ по умолчанию остаётся DIRECT.</text>
</svg>
